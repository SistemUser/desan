# ==============================================================================
# DESAN KONVEYÖR - NGINX & PHP 8.3-FPM CONFIGURATION SAMPLE
# Firma: DESAN KONVEYÖR SANAYİ VE DIŞ TİC. LTD. ŞTİ.
# ==============================================================================

server {
    listen 80;
    server_name localhost desanmakina.net www.desanmakina.net;
    root /var/www/desankonveyor;

    index index.php index.html;
    charset utf-8;

    # Security Headers
    add_header X-Powered-By "PHP/8.3 (Desan Konveyör Engine)";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";

    # SPA & Static Fallback Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API Endpoint
    location /api {
        try_files $uri /api.php?$query_string;
    }

    # Management Panel
    location /yonetim {
        try_files $uri /yonetim.html;
    }

    # PHP 8.3-FPM FastCGI Handler
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Static Asset Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|pdf|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Protect hidden configuration files
    location ~ /\.ht {
        deny all;
    }
}
